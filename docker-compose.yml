services:
  call-track-training:
    build: .
    container_name: call-track-training
    ports:
      - "4000:4000"
    volumes:
      - call-track-training-data:/data
    environment:
      - DATABASE_URL=file:/data/dev.db
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_URL=${AUTH_URL:-http://localhost:4000}
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:4000}
    restart: unless-stopped

volumes:
  call-track-training-data:
